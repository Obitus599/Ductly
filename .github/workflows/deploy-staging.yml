name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            export NVM_DIR=/var/www/vhosts/ductly.ae/.nvm
            . $NVM_DIR/nvm.sh
            cd httpdocs
            git fetch origin staging
            git reset --hard origin/staging
            npm ci
            APP_ENV=staging npx next build
            pm2 restart ductly-staging --update-env
            mkdir -p tmp && touch tmp/restart.txt

      - name: Post-deploy health check
        run: |
          set -e
          URL="https://staging.ductly.ae/api/health"
          echo "Polling $URL for up to 60s..."
          for i in $(seq 1 12); do
            code=$(curl -sk -o /tmp/health.json -w "%{http_code}" --max-time 5 "$URL" || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              echo "Got HTTP $code after $((i*5))s:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt $i: HTTP $code (retrying in 5s)"
            sleep 5
          done
          echo "Health check FAILED — staging did not respond with 200 or 503 within 60s"
          exit 1
